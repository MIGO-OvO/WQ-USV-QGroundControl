name: Android

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - 'custom/**'
      - '.github/build-config.json'
      - '.github/workflows/android.yml'
      - '.github/actions/**'
      - 'deploy/android/**'
      - 'src/**'
      - 'test/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'translations/*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Release
          - Debug
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  build:
    name: Android (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-latest
            arch: linux_gcc_64
            qt_host_path: gcc_64
            shell: bash
            primary: true
            abi: arm64-v8a
            artifact_arch: arm64
          - host: linux-emulator
            runner: ubuntu-22.04
            arch: linux_gcc_64
            qt_host_path: gcc_64
            shell: bash
            primary: false
            abi: x86_64
            artifact_arch: x86_64
          - host: mac
            runner: macos-latest
            arch: clang_64
            qt_host_path: macos
            shell: bash
            primary: false
            abi: arm64-v8a
            artifact_arch: arm64
          - host: windows
            runner: windows-latest
            arch: win64_msvc2022_64
            qt_host_path: msvc2022_64
            shell: pwsh
            primary: false
            abi: arm64-v8a
            artifact_arch: arm64

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      PACKAGE: WQ-USV-QGroundControl-Android-${{ matrix.artifact_arch }}
      BUILD_TYPE: ${{ inputs.build_type || (github.ref_type == 'tag' && 'Release' || 'Debug') }}
      QT_ANDROID_ABIS: ${{ matrix.abi }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: USV contracts and JSON
        run: python -m unittest discover -s custom/tests -p 'test_*.py' -v

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: ${{ matrix.host == 'linux-emulator' && 'linux' || matrix.host }}
          arch: ${{ matrix.arch }}
          version: ${{ steps.config.outputs.qt_version }}
          modules: ${{ steps.config.outputs.qt_modules }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cpm-modules: ${{ runner.temp }}/build/cpm_modules
          ndk-full-version: ${{ steps.config.outputs.ndk_full_version }}
          java-version: ${{ steps.config.outputs.java_version }}
          android-platform: ${{ steps.config.outputs.android_platform }}
          android-cmdline-tools: ${{ steps.config.outputs.android_cmdline_tools }}
          android-build-tools: ${{ steps.config.outputs.android_build_tools }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      # Test signing is deliberately independent of production credentials.
      # A new key per run means cross-run upgrades require uninstalling first.
      - name: Create test signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/usv-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=USV CI Debug,O=USV,C=CN"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/usv-debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          QT_DIR="${QT_ROOT_DIR//\\//}"        # Convert backslashes for Windows
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          "${QT_DIR}/bin/qt-cmake" \
            -S "${WORKSPACE}" \
            -B . -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_WARN_DEPRECATED=FALSE \
            -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}" \
            -DQT_HOST_PATH="${QT_DIR}/../${{ matrix.qt_host_path }}" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DQGC_STABLE_BUILD=${{ (github.ref_type == 'tag' || contains(github.ref, 'Stable')) && 'ON' || 'OFF' }} \
            2>&1 | tee configure.log
          grep -q 'QGC: Adding USV Custom Plugin' configure.log

      - name: Build
        shell: bash
        working-directory: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          cmake --build . --target all --config "$BUILD_TYPE" --parallel 3 2>&1 | tee build.log

      - name: Prepare Artifact
        shell: bash
        run: |
          TEMP_DIR="${RUNNER_TEMP//\\//}"  # Convert backslashes for Windows
          APK_DIR="${TEMP_DIR}/build/android-build"
          if ! ls "${APK_DIR}"/*.apk 1>/dev/null 2>&1; then
            echo "::error::No APK files found in ${APK_DIR}"
            ls -la "${APK_DIR}" 2>/dev/null || echo "Build directory does not exist"
            exit 1
          fi
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -name '*.apk')
          test "${#APKS[@]}" -eq 1
          "${ANDROID_SDK_ROOT}/build-tools/${{ steps.config.outputs.android_build_tools }}/apksigner${{ runner.os == 'Windows' && '.bat' || '' }}" verify --verbose "${APKS[0]}"
          cp "${APKS[0]}" "${TEMP_DIR}/build/${{ env.PACKAGE }}.apk"

      - name: Upload sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.host }}.apk
          path: ${{ runner.temp }}/build/${{ env.PACKAGE }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android lint
        if: matrix.primary
        shell: bash
        working-directory: ${{ runner.temp }}/build/android-build
        run: |
          set -o pipefail
          ./gradlew "lint${BUILD_TYPE}" --no-daemon --stacktrace 2>&1 | tee ../gradle-lint.log

      - name: Enable emulator KVM
        if: matrix.host == 'linux-emulator'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tablet boot smoke
        if: matrix.host == 'linux-emulator'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 custom/tests/android_boot_smoke.py "${{ runner.temp }}/build/${{ env.PACKAGE }}.apk" "${{ runner.temp }}/build/smoke"

      - name: Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.host }}-diagnostics
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/build/configure.log
            ${{ runner.temp }}/build/build.log
            ${{ runner.temp }}/build/gradle-lint.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/build/.ninja_log
            ${{ runner.temp }}/build/*deployment-settings.json
            ${{ runner.temp }}/build/android-build/build/outputs/logs/**
            ${{ runner.temp }}/build/android-build/build/reports/**
            ${{ runner.temp }}/build/smoke/**
            .github/build-config.json

      - name: Attest Build Provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: '${{ runner.temp }}/build/${{ env.PACKAGE }}.apk'
